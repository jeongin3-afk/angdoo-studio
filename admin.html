<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>앙두 관리자 | 3D 시안 관리</title>
  <link rel="icon" type="image/png" href="./assets/angdoo-logo.png" />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { background: var(--bg-deep); }
    .adm { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
    .adm__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .adm__brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-title); font-size: 26px; color: var(--point); }
    .adm__brand img { width: 30px; }
    .adm-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 22px; padding: 28px; margin-bottom: 22px; }
    .adm-card h2 { font-family: var(--font-title); font-weight: normal; font-size: 24px; margin-bottom: 16px; }
    .adm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .adm label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .adm input[type="text"], .adm input[type="password"], .adm input[type="file"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); margin-bottom: 14px;
    }
    .adm .vis { display: flex; gap: 8px; margin-bottom: 14px; }
    .adm .msg { margin-top: 10px; font-size: 14px; color: var(--point); min-height: 20px; }
    .adm .msg.ok { color: var(--green); }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line-soft); }
    .item:first-child { border-top: 0; }
    .item__title { font-weight: 700; font-size: 16px; }
    .item__meta { font-size: 13px; color: var(--ink-mute); display: flex; gap: 10px; align-items: center; margin-top: 2px; }
    .badge { font-family: var(--font-label); font-size: 13px; padding: 1px 10px; border-radius: 999px; color: var(--bg); background: var(--green); }
    .badge--private { background: var(--point); }
    .item__btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .sbtn { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 600; cursor: pointer; }
    .sbtn:hover { border-color: var(--green); color: var(--green); }
    .sbtn--del:hover { border-color: var(--point); color: var(--point); }
    .empty { color: var(--ink-mute); font-size: 14px; padding: 10px 0; }
    .viewer-box model-viewer { width: 100%; height: 60vh; background: var(--bg); border-radius: 16px; }
    @media (max-width: 640px) { .adm-row, .item { grid-template-columns: 1fr; } .item__btns { justify-content: flex-start; } }
  </style>
</head>
<body>
  <main class="adm">
    <div class="adm__top">
      <div class="adm__brand"><img src="./assets/angdoo-logo.png" alt="" />앙두 관리자</div>
      <div>
        <a href="/" class="sbtn">홈페이지</a>
        <button type="button" class="sbtn" id="logout-btn" hidden>로그아웃</button>
      </div>
    </div>

    <!-- 로그인 -->
    <section class="adm-card" id="login-card" hidden>
      <h2>관리자 로그인</h2>
      <form id="login-form">
        <label for="admin-pw">관리자 비밀번호</label>
        <input type="password" id="admin-pw" autocomplete="current-password" required />
        <button type="submit" class="btn btn--point">로그인</button>
        <p class="msg" id="login-msg"></p>
      </form>
    </section>

    <!-- 관리 화면 -->
    <div id="admin-area" hidden>
      <section class="adm-card">
        <h2>새 3D 시안 올리기</h2>
        <form id="upload-form">
          <label for="up-file">3D 파일 (.glb)</label>
          <input type="file" id="up-file" accept=".glb" required />
          <label for="up-title">제목</label>
          <input type="text" id="up-title" placeholder="예: 김앙두님 포메라니안 2차 시안" maxlength="80" required />
          <label>공개 여부</label>
          <div class="vis chips">
            <label class="chip"><input type="radio" name="vis" value="private" checked /><span>비공개 (비밀번호)</span></label>
            <label class="chip"><input type="radio" name="vis" value="public" /><span>공개</span></label>
          </div>
          <div id="up-pw-wrap">
            <label for="up-pw">고객 비밀번호 (4자 이상)</label>
            <input type="text" id="up-pw" placeholder="고객에게 알려줄 비밀번호" autocomplete="off" />
          </div>
          <button type="submit" class="btn btn--point">올리기</button>
          <p class="msg" id="up-msg"></p>
        </form>
      </section>

      <section class="adm-card">
        <h2>올라가 있는 시안 <span id="count"></span></h2>
        <div id="list"></div>
      </section>
    </div>
  </main>

  <!-- 미리보기 -->
  <div class="modal" id="preview-modal" hidden>
    <div class="modal__card viewer-box" style="max-width:820px">
      <div class="modal__head">
        <h3 id="preview-title">미리보기</h3>
        <button type="button" class="modal__close" id="preview-close" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <model-viewer id="preview-viewer" camera-controls auto-rotate shadow-intensity="0.6" exposure="1"></model-viewer>
    </div>
  </div>

  <script src="./admin.js" defer></script>
</body>
</html>
